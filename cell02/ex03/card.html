<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="card.css">
</head>

<body>
    <div class="card">
        <div class="card-header">
            <h2>User Profile</h2>
        </div>

        <table class="profile-table">
            <tr>
                <td>

                    <img class="avatar"
                        src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSsWZsQD44RWRBZn-cpRNuqpd3ZyH-LAnmZBatfVJXz9Q&s=10"
                        alt="profile">
                    <p class="login-name">jwapakpe</p>
                </td>
            </tr>

            <tr>
                <td>
                    <p class="description">Junior Web Developer</p>
                </td>
            </tr>

            <tr>
                <td>
                    <div class="social-links">
                        <!-- Facebook -->
                        <a href="https://facebook.com" target="_blank">
                            <img src="https://upload.wikimedia.org/wikipedia/commons/b/b8/2021_Facebook_icon.svg"
                                alt="Facebook">
                        </a>

                        <!-- X (Twitter) -->
                        <a href="https://x.com" target="_blank">
                            <img src="https://upload.wikimedia.org/wikipedia/commons/5/5a/X_%28formerly_Twitter%29_logo_late_2023.svg"
                                alt="X">
                        </a>

                        <!-- LinkedIn -->
                        <a href="https://linkedin.com" target="_blank">
                            <img src="https://upload.wikimedia.org/wikipedia/commons/8/81/LinkedIn_icon.svg"
                                alt="LinkedIn">
                        </a>

                        <!-- GitHub -->
                        <a href="https://github.com" target="_blank">
                            <img src="https://upload.wikimedia.org/wikipedia/commons/9/91/Octicons-mark-github.svg"
                                alt="GitHub">
                        </a>
                    </div>
                </td>
            </tr>

            <tr>
                <td><button class="contact-btn" type="button">Contact</button>
                </td>
            </tr>

        </table>
    </div>
</body>

</html>
